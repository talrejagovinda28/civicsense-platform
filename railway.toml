# Shared Railway config — each service MUST set its own dockerfile via Variables:
#   Backend:  RAILWAY_DOCKERFILE_PATH=Dockerfile.backend
#   Frontend: RAILWAY_DOCKERFILE_PATH=Dockerfile.frontend
#
# Do NOT set a global startCommand here — it breaks the frontend (Node) service.

[build]
builder = "DOCKERFILE"

[deploy]
restartPolicyType = "ON_FAILURE"
