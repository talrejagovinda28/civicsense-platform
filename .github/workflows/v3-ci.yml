name: CivicSense V3 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/civicsense-accountability-social]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migration graph
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and API tests (isolated SQLite)
        run: python -m pytest -q
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          CLERK_JWKS_URL: https://example.test/.well-known/jwks.json
          ENVIRONMENT: test
          CIVICSENSE_ALLOW_FAKE_ADAPTERS: 'true'
      - name: Alembic migration graph (offline, no production DB)
        run: python -m alembic heads && python -m alembic history
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          CLERK_JWKS_URL: https://example.test/.well-known/jwks.json
          ENVIRONMENT: test
      - name: Python lint (correctness)
        run: python -m ruff check . --ignore E501,I001,F401
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          NEXT_PUBLIC_API_URL: https://example.test
          VERCEL_ENV: preview
