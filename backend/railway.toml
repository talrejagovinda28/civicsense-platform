# Backend Railway service
# Start = uvicorn only. Do NOT put `alembic upgrade` here.
# If the Railway dashboard still has pre-deploy `python -m alembic upgrade head`,
# clear it before merging PR #1 (see docs/CIVICSENSE_DEPLOY_RUNBOOK.md).

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/v1/health"
restartPolicyType = "ON_FAILURE"
